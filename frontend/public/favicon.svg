<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- PATHS "Wheel Rings" mark — a potter's wheel from above (clay core, thrown terracotta
       ring, outer scan-trace ring). Outer ring simplified to solid (source design uses a
       dashed ring, imperceptible at 16-32px favicon size) — same size-legibility tradeoff
       the source design itself makes between its large Icon (dashed) and small lockup-icon
       (bolder dashed) renditions; see src/components/PathsMark.jsx for the full-detail
       dashed version used everywhere it's shown larger. -->
  <rect width="64" height="64" rx="14" fill="#2A241F" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="#F6EFE4" stroke-width="3" />
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#C1662E" stroke-width="7" />
  <circle cx="32" cy="32" r="5.5" fill="#F6EFE4" />
</svg>
