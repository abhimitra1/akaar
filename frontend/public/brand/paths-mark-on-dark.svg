<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="560" height="280">
  <!-- PATHS "Wheel Rings" mark — on-dark chip (icon + wordmark on the mark's own ink tile).
       Source: Claude Design "PATHS logo directions" / PATHS Logo - Wheel Rings.dc.html. -->
  <rect width="280" height="140" rx="16" fill="#2A241F" />
  <g transform="translate(30,20) scale(0.9)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#F6EFE4" stroke-width="4" stroke-dasharray="5 5" />
    <circle cx="50" cy="50" r="24" fill="none" stroke="#C1662E" stroke-width="10" />
    <circle cx="50" cy="50" r="9" fill="#F6EFE4" />
  </g>
  <text x="122" y="80" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="30" letter-spacing="4" fill="#F6EFE4">PATHS</text>
</svg>
