<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 130" width="920" height="260">
  <!-- PATHS "Wheel Rings" horizontal lockup — icon + wordmark + tagline, ink-on-transparent.
       Source: Claude Design "PATHS logo directions" / PATHS Logo - Wheel Rings.dc.html.
       Wordmark uses Space Grotesk, tagline uses Spectral italic — if the viewing app/OS
       doesn't have those fonts installed, this falls back to the generic sans/serif below. -->
  <g transform="translate(20,15) scale(0.9)">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#2A241F" stroke-width="4" stroke-dasharray="5 5" />
    <circle cx="50" cy="50" r="24" fill="none" stroke="#C1662E" stroke-width="10" />
    <circle cx="50" cy="50" r="9" fill="#2A241F" />
  </g>
  <text x="150" y="68" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="34" letter-spacing="4" fill="#2A241F">PATHS</text>
  <text x="150" y="92" font-family="'Spectral', serif" font-style="italic" font-size="15" fill="#8A7A63">Design Thinking by Thinking Design</text>
</svg>
